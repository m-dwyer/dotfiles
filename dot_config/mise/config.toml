[tools]
tilt = "latest"
gum = "latest"
# Pinned to a major: global CLIs installed with `pnpm add -g` live in
# $PNPM_HOME/global/<schema>, and the schema dir changes across majors.
pnpm = "10"
node = "24"

[settings]
env_shell_expand = true

[env]
PLATFORM_DEV_CONFIG = "$HOME/.config/platform-dev"

